<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Periodic Table Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155;
            --alkali: #ef4444; --alkaline: #fbbf24; --transition: #92400e;
            --post-transition: #10b981; --metalloid: #0d9488; --nonmetal: #2563eb;
            --noble: #7c3aed; --lanthanide: #d946ef; --actinide: #ec4899;
        }

        * { box-sizing: border-box; touch-action: manipulation; }

        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Locks vertical scrolling */
        }

        .game-container {
            display: flex; flex-direction: column;
            height: 100%; width: 100%; padding: 10px;
            align-items: center; justify-content: flex-start;
        }

        /* Stats & Controls Bar */
        .top-bar {
            display: flex; gap: 20px; align-items: center; justify-content: center;
            background: var(--card); padding: 8px 25px; margin-bottom: 15px;
            border-radius: 50px; border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 10; flex-wrap: wrap; 
        }

        .stat-item { font-size: 0.9rem; font-weight: 500; }
        .stat-item strong { color: #60a5fa; }

        .btn {
            background: #334155; color: white; border: 1px solid #475569;
            padding: 6px 16px; border-radius: 20px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px; /* Aligns icons properly */
        }
        .btn i { font-size: 0.9rem; }
        .btn:hover { background: #475569; transform: translateY(-1px); }
        .btn-skip { background: #1e293b; color: #94a3b8; }
        .btn-hint { color: #fcd34d; } /* Gives the hint icon a yellowish tint */

        /* Element Spawner */
        #element-source {
            height: 100px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px; flex-shrink: 0;
        }

        .draggable-element {
            width: 80px; height: 80px; background: #334155;
            border: 2px solid #64748b; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: grab; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: border-color 0.2s;
        }
        .draggable-element:active { cursor: grabbing; }
        .draggable-element strong { font-size: 1.6rem; }
        .draggable-element span { font-size: 0.7rem; opacity: 0.8; text-align: center;}

        /* The Grid & Responsive Wrapper */
        .table-wrap {
            flex: 1; display: flex; 
            align-items: flex-start; justify-content: flex-start;
            width: 100%; overflow-x: auto; overflow-y: hidden;
            padding-bottom: 20px; 
        }

        @media (min-width: 900px) {
            .table-wrap { justify-content: center; align-items: center; } 
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(18, clamp(35px, 4vw, 50px));
            grid-template-rows: repeat(10, clamp(40px, 6vh, 52px));
            gap: 4px; padding: 0 15px;
            min-width: max-content; 
        }

        .slot {
            background: rgba(30, 41, 59, 0.4); border: 1px solid var(--border);
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem); transition: 0.2s; cursor: pointer;
        }
        .slot.empty { border: none; background: transparent; pointer-events: none; }
        .slot.drag-over { background: rgba(255,255,255,0.15); border-color: #fff; transform: scale(1.05); }
        
        /* Spacer Row */
        .slot[data-row="8"] { height: 15px; border: none; }

        /* Element Colors */
        .alkali { background: var(--alkali); } .alkaline { background: var(--alkaline); }
        .transition { background: var(--transition); } .post-transition { background: var(--post-transition); }
        .metalloid { background: var(--metalloid); } .nonmetal { background: var(--nonmetal); }
        .noble { background: var(--noble); } .lanthanide { background: var(--lanthanide); }
        .actinide { background: var(--actinide); }

        .filled { animation: celebrate 0.5s ease; border: none; font-weight: bold; color: white; cursor: default; }
        .hint-pulse { animation: pulse 0.6s infinite alternate; border: 2px solid white !important; z-index: 5; }

        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { from { box-shadow: 0 0 0px white; } to { box-shadow: 0 0 15px white; background: rgba(255,255,255,0.2); } }
        @keyframes celebrate { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .grid { gap: 2px; }
            .top-bar { gap: 10px; padding: 5px 15px; margin-bottom: 5px; }
            .draggable-element { width: 70px; height: 70px; }
            .draggable-element strong { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="stat-item">Score: <strong id="score">0</strong></div>
        <div class="stat-item">Left: <strong id="remaining">118</strong></div>
        <button class="btn" id="hint-btn">
            <i class="fa-solid fa-lightbulb btn-hint"></i> Hint (-5)
        </button>
        <button class="btn btn-skip" id="skip-btn">
            <i class="fa-solid fa-forward-step"></i> Skip
        </button>
    </div>

    <div id="element-source"></div>

    <div class="table-wrap">
        <div class="grid" id="grid"></div>
    </div>
</div>

l:9,cat:"actinide"},{id:95,symbol:"Am",name:"Americium",row:10,col:10,cat:"actinide"},{id:96,symbol:"Cm",name:"Curium",row:10,col:11,cat:"actinide"},{id:97,symbol:"Bk",name:"Berkelium",row:10,col:12,cat:"actinide"},{id:98,symbol:"Cf",name:"Californium",row:10,col:13,cat:"actinide"},{id:99,symbol:"Es",name:"Einsteinium",row:10,col:14,cat:"actinide"},{id:100,symbol:"Fm",name:"Fermium",row:10,col:15,cat:"actinide"},{id:101,symbol:"Md",name:"Mendelevium",row:10,col:16,cat:"actinide"},{id:102,symbol:"No",name:"Nobelium",row:10,col:17,cat:"actinide"},{id:103,symbol:"Lr",name:"Lawrencium",row:10,col:18,cat:"actinide"},{id:104,symbol:"Rf",name:"Rutherfordium",row:7,col:4,cat:"transition"},{id:105,symbol:"Db",name:"Dubnium",row:7,col:5,cat:"transition"},{id:106,symbol:"Sg",name:"Seaborgium",row:7,col:6,cat:"transition"},{id:107,symbol:"Bh",name:"Bohrium",row:7,col:7,cat:"transition"},{id:108,symbol:"Hs",name:"Hassium",row:7,col:8,cat:"transition"},{id:109,symbol:"Mt",name:"Meitnerium",row:7,col:9,cat:"transition"},{id:110,symbol:"Ds",name:"Darmstadtium",row:7,col:10,cat:"transition"},{id:111,symbol:"Rg",name:"Roentgenium",row:7,col:11,cat:"transition"},{id:112,symbol:"Cn",name:"Copernicium",row:7,col:12,cat:"transition"},{id:113,symbol:"Nh",name:"Nihonium",row:7,col:13,cat:"post-transition"},{id:114,symbol:"Fl",name:"Flerovium",row:7,col:14,cat:"post-transition"},{id:115,symbol:"Mc",name:"Moscovium",row:7,col:15,cat:"post-transition"},{id:116,symbol:"Lv",name:"Livermorium",row:7,col:16,cat:"post-transition"},{id:117,symbol:"Ts",name:"Tennessine",row:7,col:17,cat:"metalloid"},{id:118,symbol:"Og",name:"Oganesson",row:7,col:18,cat:"noble"}
    ];

    let score = 0, current = null, pool = [...elements];
    let isMobileSelected = false; 
    
    const grid = document.getElementById('grid'), source = document.getElementById('element-source'),
          scoreEl = document.getElementById('score'), remEl = document.getElementById('remaining'),
          hintBtn = document.getElementById('hint-btn'), skipBtn = document.getElementById('skip-btn');

    function init() {
        grid.innerHTML = '';
        for (let r = 1; r <= 10; r++) {
            for (let c = 1; c <= 18; c++) {
                const slot = document.createElement('div');
                const isElementSlot = elements.some(e => e.row === r && e.col === c);
                
                slot.className = isElementSlot ? 'slot' : 'slot empty';
                slot.dataset.row = r; slot.dataset.col = c;

                if (isElementSlot) {
                    slot.addEventListener('dragover', e => e.preventDefault());
                    slot.addEventListener('dragenter', () => slot.classList.add('drag-over'));
                    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
                    slot.addEventListener('drop', handleDrop);
                    slot.addEventListener('click', handleMobileClick);
                }
                grid.appendChild(slot);
            }
        }
        spawn();
    }

    function spawn() {
        if (!pool.length) {
            // Replaced trophy emoji with FontAwesome trophy icon
            source.innerHTML = "<h2 style='display: flex; align-items: center; gap: 10px;'>Mission Accomplished! <i class='fa-solid fa-trophy' style='color: #fbbf24;'></i></h2>";
            return;
        }
        
        isMobileSelected = false; 
        const idx = Math.floor(Math.random() * pool.length);
        current = pool.splice(idx, 1)[0];
        remEl.innerText = pool.length + 1;
        
        source.innerHTML = `
            <div class="draggable-element" draggable="true" id="current-atom">
                <small>${current.id}</small>
                <strong>${current.symbol}</strong>
                <span>${current.name}</span>
            </div>
        `;

        const atomEl = document.getElementById('current-atom');
        
        atomEl.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text', current.id);
        });

        atomEl.addEventListener('click', () => {
            isMobileSelected = true;
            atomEl.style.borderColor = '#fbbf24'; 
            atomEl.style.boxShadow = '0 0 15px rgba(251, 191, 36, 0.5)';
        });
    }

    function processPlacement(slotElement) {
        if (parseInt(slotElement.dataset.row) === current.row && parseInt(slotElement.dataset.col) === current.col) {
            slotElement.classList.add('filled', current.cat);
            slotElement.innerHTML = `<span>${current.symbol}</span>`;
            slotElement.style.pointerEvents = 'none';
            score += 10; scoreEl.innerText = score;
            spawn();
        } else {
            slotElement.style.background = "#450a0a";
            setTimeout(() => slotElement.style.background = "", 500);
        }
    }

    function handleDrop(e) {
        this.classList.remove('drag-over');
        processPlacement(this);
    }

    function handleMobileClick() {
        if (isMobileSelected && current) {
            processPlacement(this);
        }
    }

    skipBtn.addEventListener('click', () => {
        if (!current) return;
        pool.push(current);
        spawn();
    });

    hintBtn.addEventListener('click', () => {
        if (!current) return;
        const target = Array.from(document.querySelectorAll('.slot')).find(s => 
            s.dataset.row == current.row && s.dataset.col == current.col
        );
        if (target) {
            target.classList.add('hint-pulse');
            score = Math.max(0, score - 5);
            scoreEl.innerText = score;
            setTimeout(() => target.classList.remove('hint-pulse'), 2000);
        }
    });

    init();
</script>
